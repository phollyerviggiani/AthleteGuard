<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Training Session</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="navbar">
    <h2>AthleteGuard</h2>
    <a th:href="@{/athletes}">Athletes</a>
</div>

<div class="container">

    <div class="card">
        <div class="page-title"
             th:text="'Add Training Session for ' + ${athlete.firstName} + ' ' + ${athlete.lastName}">
        </div>

        <form th:action="@{'/athletes/' + ${athlete.athleteId} + '/sessions'}"
              th:object="${trainingSession}"
              method="post">

            <div class="form-group">
                <label>Session Date</label>
                <input type="date" th:field="*{sessionDate}" required>
            </div>

            <div class="form-group">
                <label>Duration (minutes)</label>
                <input type="number" th:field="*{durationMinutes}" min="1" required>
            </div>

            <div class="form-group">
                <label>Intensity (1–10)</label>
                <input type="number" th:field="*{intensity}" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label>Session Type</label>
                <input type="text" th:field="*{sessionType}" required>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea th:field="*{notes}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Save Session</button>

                <a th:href="@{'/athletes/' + ${athlete.athleteId}}"
                   class="btn-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
