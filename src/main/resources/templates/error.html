<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Oops! Error</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="navbar">
  <h2>AthleteGuard</h2>
  <div class="navbar-right">
    <span class="navbar-user" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post" style="display:inline;">
      <button type="submit" class="btn-navbar-logout">Logout</button>
    </form>
  </div>
</div>

<div class="container">
  <div class="card error-container">
    <h1 class="error-code">Something went wrong!</h1>
    <p>We're sorry, but an unexpected error has occurred on our end.</p>
    <p>Try again later.</p>
    <br>
    <a th:href="@{/athletes}">
      <button>Return to Dashboard</button>
    </a>
  </div>
</div>

</body>
</html>
