<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Athlete Details</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="navbar">
    <h2>AthleteGuard</h2>
    <a th:href="@{/athletes}">Athletes</a>
</div>

<div class="container">

    <h1 th:text="${athlete.firstName + ' ' + athlete.lastName}"></h1>

    <div class="actions">
        <a class="btn-primary"
           th:href="@{'/athletes/' + ${athlete.athleteId} + '/sessions/new'}">
            Add Training Session
        </a>

        <a class="btn-secondary"
           th:href="@{'/athletes/' + ${athlete.athleteId} + '/sessions'}">
            View Training Sessions
        </a>
    </div>

    <div class="card">
        <p><strong>Sport:</strong> <span th:text="${athlete.sport}"></span></p>
        <p><strong>Position:</strong> <span th:text="${athlete.position}"></span></p>
    </div>

    <div class="card">
        <h3>Latest Workload Summary</h3>

        <div th:if="${summary == null or summary.periodEndDate.isBefore(T(java.time.LocalDate).now().minusDays(28))}">
            <p>Log at least 3 training sessions in the last 28 days to generate workload metrics.</p>
        </div>

        <div th:if="${summary != null and summary.periodEndDate.isAfter(T(java.time.LocalDate).now().minusDays(28))}">
            <p><strong>Acute:</strong> <span th:text="${#numbers.formatDecimal(summary.acuteWorkload, 1, 1)}"></span></p>
            <p><strong>Chronic:</strong> <span th:text="${#numbers.formatDecimal(summary.chronicWorkload, 1, 1)}"></span></p>
            <p><strong>ACWR:</strong> <span th:text="${#numbers.formatDecimal(summary.acwr, 1, 1)}"></span></p>
        </div>

    </div>

    <div class="card">
        <h3>Current Injury Risk</h3>

        <div th:if="${risk != null}">
            <span class="badge"
                  th:classappend="${risk.riskLevel == 'HIGH'} ? ' badge-high' : (${risk.riskLevel == 'MODERATE'} ? ' badge-moderate' : (${risk.riskLevel == 'UNDERLOAD'} ? ' badge-underload' : ' badge-low'))"
                  th:text="${risk.riskLevel}">
            </span>

            <p th:text="${risk.reason}"></p>
        </div>

        <div th:if="${risk == null}">
            <p>No risk flags generated yet.</p>
        </div>
    </div>

</div>

</body>
</html>
